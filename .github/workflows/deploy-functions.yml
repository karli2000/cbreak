# Deploys the github-age Edge Function to the hosted Supabase project when a merge into main changes it.
# Bundled server-side (--use-api), so no Docker is needed. Its GITHUB_TOKEN secret stays in the dashboard.
name: Deploy functions

on:
  push:
    branches: [main]
    paths:
      - 'supabase/functions/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-functions
  cancel-in-progress: false

env:
  PROJECT_REF: meioekkvutvrspfvqgye

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - name: Check the secrets
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::The repository secret SUPABASE_ACCESS_TOKEN is missing (docs/deploy.md, Automatic deploys)"
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - name: Deploy github-age
        run: bunx supabase functions deploy github-age --use-api --remote="$PROJECT_REF" --yes
