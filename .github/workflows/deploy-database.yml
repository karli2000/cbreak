# Applies new migrations to the hosted Supabase project when a merge into main changes them.
# The pgTAP suite runs against a fresh local stack first; a failing test stops the push.
# Never add `supabase config push` here: auth is configured in the dashboard (docs/deploy.md).
name: Deploy database

on:
  push:
    branches: [main]
    paths:
      - 'supabase/migrations/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-database
  cancel-in-progress: false

env:
  PROJECT_REF: meioekkvutvrspfvqgye

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - name: Start the local stack
        run: bunx supabase start -x studio,imgproxy,mailpit,logflare,vector,supavisor,edge-runtime
      - name: pgTAP
        run: bun run db:test

  deploy:
    # a run started by hand on another branch deploys nothing
    if: github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - name: Check the secrets
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::The repository secret SUPABASE_ACCESS_TOKEN is missing (docs/deploy.md, Automatic deploys)"
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - name: Migrations to apply
        run: bunx supabase db push --remote="$PROJECT_REF" --skip-vault --dry-run
      - name: Apply them
        run: bunx supabase db push --remote="$PROJECT_REF" --skip-vault --yes
