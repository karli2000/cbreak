name: Bug report
description: Something in cbreak does not work as it should.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. Please never paste prompts, code, file names or chat messages of other people here.
        Security problems go through private vulnerability reporting instead (see SECURITY.md).
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected and what happened instead.
    validations:
      required: true
  - type: input
    id: plugin
    attributes:
      label: cbreak version
      description: Shown by `/plugin` (for example 0.3.10).
    validations:
      required: true
  - type: input
    id: claude
    attributes:
      label: Claude Code version
      description: Output of `claude --version`.
    validations:
      required: true
  - type: input
    id: bun
    attributes:
      label: Bun version and operating system
      description: Output of `bun --version`, plus macOS, Linux, or Windows with WSL.
  - type: textarea
    id: output
    attributes:
      label: What `/cbreak status` says
      description: Leave out anything private.
      render: text
